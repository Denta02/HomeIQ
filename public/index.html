<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HomeIQ</title>
<style>
  :root {
    --papier:   #F2F5F5;
    --karte:    #FFFFFF;
    --tinte:    #10272C;
    --leise:    #5B7076;
    --linie:    #DCE4E5;

    --akzent:   #0E6E73;
    --akzent-d: #0A5458;

    --rot:        #B3261E;
    --rot-h:      #FBECEA;
    --bernstein:  #92540A;
    --bernstein-h:#FBF2E4;
    --gruen:      #1C6B4A;
    --gruen-h:    #E8F3ED;

    --tief: #0B2126;

    --zahl: "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
    --text: Roboto, system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--papier); }

  body {
    color: var(--tinte);
    font-family: var(--text);
    font-size: 16px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .huelle { max-width: 600px; margin: 0 auto; padding: 0 18px 56px; }

  /* ---------- Kopf: das Gebäude tritt zurück ---------- */

  .ort {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; padding: 20px 0 14px;
  }
  .ort h1 { font-size: 17px; font-weight: 500; margin: 0; letter-spacing: -0.01em; }
  .ort button {
    flex: 0 0 auto; font: inherit; font-size: 14px;
    background: none; border: 0; padding: 4px 0;
    color: var(--akzent); cursor: pointer;
  }
  .ort button:hover { color: var(--akzent-d); }

  /* ---------- Held: der dringendste Punkt als Satz ---------- */

  .brennpunkt {
    background: var(--tief); color: #fff;
    border-radius: 14px; padding: 22px 20px; margin-bottom: 10px;
  }
  .brennpunkt .was {
    font-size: 25px; font-weight: 600; line-height: 1.2;
    letter-spacing: -0.02em; margin: 0 0 8px;
  }
  .brennpunkt .wo { font-size: 14.5px; color: #9FBDC0; margin: 0; }
  .brennpunkt .seit {
    display: inline-block; margin-top: 14px;
    font-family: var(--zahl); font-size: 14px; font-weight: 600;
    padding: 5px 11px; border-radius: 999px;
  }
  .brennpunkt .seit.rot  { background: #4A1511; color: #FFC8C2; }
  .brennpunkt .seit.gelb { background: #4A3209; color: #FFDFA8; }
  .brennpunkt.ruhe { background: var(--gruen-h); color: var(--tinte); }
  .brennpunkt.ruhe .was { color: var(--gruen); }
  .brennpunkt.ruhe .wo { color: var(--leise); }

  .bilanz {
    display: flex; gap: 20px; padding: 2px 4px 24px;
    font-size: 14px; color: var(--leise);
  }
  .bilanz b { font-family: var(--zahl); font-size: 16px; color: var(--tinte); }
  .bilanz .rot b  { color: var(--rot); }
  .bilanz .gelb b { color: var(--bernstein); }

  /* ---------- Geräte: der Hauptinhalt ---------- */

  .kopfzeile {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin: 0 0 12px;
  }
  .kopfzeile h2 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }

  .plus {
    font: inherit; font-size: 15px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--akzent); color: #fff;
    border: 0; border-radius: 999px;
    padding: 9px 16px 9px 13px;
    cursor: pointer; text-decoration: none;
  }
  .plus:hover { background: var(--akzent-d); }
  .plus span { font-size: 20px; line-height: 1; margin-top: -2px; }

  .geraete { list-style: none; margin: 0; padding: 0; }
  .geraete li { margin-bottom: 10px; }
  .geraete a {
    display: block; background: var(--karte);
    border: 1px solid var(--linie); border-left: 5px solid var(--linie);
    border-radius: 12px; padding: 15px 16px;
    color: inherit; text-decoration: none;
  }
  .geraete a:hover { border-color: var(--akzent); }
  .geraete a.offen { border-left-color: var(--rot); }
  .geraete a.bald  { border-left-color: var(--bernstein); }
  .geraete a.ruhig { border-left-color: var(--gruen); }
  .geraete .name {
    font-size: 18px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 2px;
  }
  .geraete .raum { font-size: 14px; color: var(--leise); }
  .geraete .lage {
    margin-top: 10px; font-size: 14px;
    display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center;
  }

  .punkt {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--zahl); font-weight: 600; font-size: 13.5px;
    padding: 3px 10px; border-radius: 999px;
  }
  .punkt.rot  { background: var(--rot-h); color: var(--rot); }
  .punkt.gelb { background: var(--bernstein-h); color: var(--bernstein); }
  .punkt.gruen{ background: var(--gruen-h); color: var(--gruen); }
  .punkt.still{ background: var(--papier); color: var(--leise); }

  /* ---------- Leerer Anfang ---------- */

  .anfang {
    background: var(--karte); border: 1px solid var(--linie);
    border-radius: 14px; padding: 30px 22px; text-align: center;
  }
  .anfang h2 { font-size: 21px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em; }
  .anfang p { color: var(--leise); margin: 0 auto 22px; max-width: 34em; font-size: 15px; }
  .anfang .plus { margin-bottom: 14px; }

  /* ---------- Was ansteht ---------- */

  section { margin-top: 32px; }

  .anstehend { list-style: none; margin: 0; padding: 0; }
  .anstehend li {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--linie);
  }
  .anstehend li:last-child { border-bottom: 0; }
  .anstehend .sache { font-weight: 500; }
  .anstehend .quelle { font-size: 13.5px; color: var(--leise); }
  .anstehend .frist {
    flex: 0 0 auto; text-align: right; white-space: nowrap;
    font-family: var(--zahl); font-weight: 600; font-size: 15px;
  }
  .anstehend .frist small { display: block; font-weight: 400; font-size: 12.5px; }
  .anstehend li.rot .frist  { color: var(--rot); }
  .anstehend li.gelb .frist { color: var(--bernstein); }
  .anstehend li.ok .frist   { color: var(--leise); }

  details.mehr { margin-top: 14px; }
  details.mehr > summary {
    font-size: 14.5px; color: var(--akzent); cursor: pointer;
    padding: 4px 0; list-style: none;
  }
  details.mehr > summary::-webkit-details-marker { display: none; }
  details.mehr > summary::before { content: "Alles anzeigen"; }
  details.mehr[open] > summary::before { content: "Weniger anzeigen"; }

  /* ---------- Fuß ---------- */

  .stichtag {
    display: flex; align-items: center; gap: 10px;
    margin-top: 32px; font-size: 13.5px; color: var(--leise);
  }
  input[type="date"] {
    font: inherit; font-family: var(--zahl); color: var(--tinte);
    background: var(--karte); border: 1px solid var(--linie);
    border-radius: 8px; padding: 7px 10px;
  }
  input:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible {
    outline: 2px solid var(--akzent); outline-offset: 2px;
  }

  .lage-zeile {
    margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--linie);
    font-size: 13px; color: var(--leise);
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
  }
  .lage-zeile button {
    font: inherit; font-size: 13px; background: none; border: 0;
    color: var(--akzent); cursor: pointer; padding: 0;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .lage-zeile .warnung { color: var(--bernstein); }

  .fussnote { margin-top: 20px; font-size: 12.5px; color: var(--leise); }

  .fehlerkasten {
    margin: 20px 0; border-left: 5px solid var(--rot);
    background: var(--rot-h); border-radius: 12px; padding: 18px;
  }
  .fehlerkasten h2 { margin: 0 0 6px; font-size: 18px; color: var(--rot); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="huelle" id="huelle">
  <div class="fehlerkasten" id="ladefehler" hidden>
    <h2>Module fehlen</h2>
    <p>Diese Dateien müssen im Ordner <code>js/</code> liegen: <code>fristen.js</code>,
       <code>brennstoff.js</code>, <code>objekt.js</code>, <code>speicher.js</code>,
       <code>sync.js</code>, <code>drive.js</code>, <code>belege.js</code>,
       <code>app.js</code>.</p>
  </div>
</div>

<!-- Client-ID der Cloud Console eintragen, dann läuft der
     Drive-Abgleich auch im Browser. Leer = nur lokal. -->
<script>window.HOMEIQ_CLIENT_ID = "";</script>
<script src="js/fristen.js"></script>
<script src="js/hersteller.js"></script>
<script src="js/selbsthilfe.js"></script>
<script src="js/intervalle.js"></script>
<script src="js/brennstoff.js"></script>
<script src="js/objekt.js"></script>
<script src="js/speicher.js"></script>
<script src="js/sync.js"></script>
<script src="js/drive.js"></script>
<script src="js/drive-web.js"></script>
<script src="js/belege.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  'use strict';

  if (typeof window.Fristen === 'undefined' || typeof window.Objekt === 'undefined' ||
      typeof window.Speicher === 'undefined' || typeof window.App === 'undefined') {
    document.getElementById('ladefehler').hidden = false;
    return;
  }
  var F = window.Fristen, BR = window.Brennstoff, OB = window.Objekt;

  var objekt = null;
  var stichtagStand = null;
  var alleOffen = false;
  var meldung = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function deDatum(iso) {
    if (!F.istGueltigesDatum(iso)) return '–';
    var t = F.parseISO(iso);
    return String(t.tag).padStart(2, '0') + '.' + String(t.monat).padStart(2, '0') + '.' + t.jahr;
  }

  function restText(status, tage) {
    if (tage === null || tage === undefined) return '';
    if (status === 'abgelaufen') return 'seit ' + Math.abs(tage) + ' Tagen';
    if (status === 'laeuft_heute_ab') return 'heute';
    if (tage < 45) return 'in ' + tage + ' Tagen';
    return 'in ' + Math.round(tage / 30.4) + ' Monaten';
  }

  function dringend(e) {
    return e.status === 'abgelaufen' || e.status === 'bald' || e.status === 'laeuft_heute_ab';
  }

  /* ---------- Held ----------
     Nicht die große Zahl mit Label, sondern der Satz, für den man die
     App überhaupt öffnet: was ist dran, bei welchem Gerät, seit wann. */

  function brennpunkt(liste) {
    var offen = liste.filter(dringend);
    if (!offen.length) {
      return '<div class="brennpunkt ruhe">' +
        '<p class="was">Nichts offen.</p>' +
        '<p class="wo">Keine Frist überschritten, nichts in den nächsten 30 Tagen fällig.</p>' +
        '</div>';
    }
    var e = offen[0];
    var rot = e.status === 'abgelaufen';
    return '<div class="brennpunkt">' +
      '<p class="was">' + esc(e.titel) + '</p>' +
      '<p class="wo">' + esc(e.geraetName) +
        (e.gegenueber ? ' · ' + esc(e.gegenueber) : '') + '</p>' +
      '<span class="seit ' + (rot ? 'rot' : 'gelb') + '">' +
        (rot ? 'überfällig ' : 'fällig ') + esc(restText(e.status, e.restTage)) + '</span>' +
      '</div>';
  }

  function bilanz(z) {
    if (!z.gesamt) return '';
    return '<div class="bilanz">' +
      (z.abgelaufen ? '<span class="rot"><b>' + z.abgelaufen + '</b> überfällig</span>' : '') +
      (z.bald ? '<span class="gelb"><b>' + z.bald + '</b> demnächst</span>' : '') +
      '<span><b>' + z.ok + '</b> im Rahmen</span>' +
      '</div>';
  }

  /* ---------- Geräte ---------- */

  function geraeteListe(liste) {
    return '<ul class="geraete">' + objekt.geraete.map(function (g) {
      var eigene = OB.fuerGeraet(liste, g.id);
      var z = OB.zusammenfassung(eigene);
      var klasse = z.abgelaufen ? 'offen' : (z.bald ? 'bald' : 'ruhig');

      var marken = '';
      if (z.abgelaufen) marken += '<span class="punkt rot">' + z.abgelaufen + ' überfällig</span>';
      if (z.bald) marken += '<span class="punkt gelb">' + z.bald + ' demnächst</span>';
      if (!z.abgelaufen && !z.bald) {
        marken += '<span class="punkt gruen">' +
          (z.gesamt ? 'alles im Rahmen' : 'noch nichts erfasst') + '</span>';
      }
      if (g.lieferungen && g.lieferungen.length && BR) {
        var sp = BR.verbrauchSpanne(g.lieferungen, F.istGueltigesDatum, F.tageZwischen);
        if (sp.belastbar) {
          marken += '<span class="punkt still">' +
            BR.mengeText(Math.round(sp.proJahrHundertstel), g.lieferungen[0].einheit) +
            ' im Jahr</span>';
        }
      }

      return '<li><a href="geraeteakte.html?g=' + encodeURIComponent(g.id) +
        '" class="' + klasse + '">' +
        '<div class="name">' + esc(g.name) + '</div>' +
        (g.standort ? '<div class="raum">' + esc(g.standort) + '</div>' : '') +
        '<div class="lage">' + marken + '</div>' +
        '</a></li>';
    }).join('') + '</ul>';
  }

  /* Ein leerer Bildschirm ist eine Aufforderung, nicht eine Meldung. */
  function leererAnfang() {
    return '<div class="anfang">' +
      '<h2>Noch kein Gerät erfasst</h2>' +
      '<p>Leg das erste an: Waschmaschine, Heizung, Laptop. HomeIQ merkt sich, ' +
      'bis wann die Gewährleistung läuft und wann die nächste Wartung fällig ist.</p>' +
      '<a class="plus" href="geraeteakte.html?neu=1"><span>+</span>Gerät anlegen</a>' +
      '</div>';
  }

  /* ---------- Was ansteht ---------- */

  function anstehend(liste) {
    if (!liste.length) return '';
    var offen = liste.filter(dringend);
    var rest = liste.filter(function (e) { return !dringend(e); });

    var zeile = function (e) {
      var klasse = e.status === 'abgelaufen' ? 'rot' : (dringend(e) ? 'gelb' : 'ok');
      return '<li class="' + klasse + '">' +
        '<div><div class="sache">' + esc(e.titel) + '</div>' +
        '<div class="quelle">' + esc(e.geraetName) + '</div></div>' +
        '<div class="frist">' + (e.datum ? deDatum(e.datum) : 'unklar') +
        '<small>' + esc(restText(e.status, e.restTage)) + '</small></div></li>';
    };

    return '<section>' +
      '<div class="kopfzeile"><h2>' +
        (offen.length ? 'Zu erledigen' : 'Alle Fristen') + '</h2></div>' +
      '<ul class="anstehend">' + (offen.length ? offen : rest).map(zeile).join('') + '</ul>' +
      (offen.length && rest.length
        ? '<details class="mehr"' + (alleOffen ? ' open' : '') + ' id="mehr"><summary></summary>' +
          '<ul class="anstehend">' + rest.map(zeile).join('') + '</ul></details>'
        : '') +
      '</section>';
  }

  /* ---------- Fuß ---------- */

  function lageZeile() {
    var sp = window.App.zustand.speicher;
    var sy = window.App.zustand.sync;
    var dauerhaft = sp ? sp.zustand().dauerhaft : false;
    var an = sy ? sy.istAktiv() : false;
    var verbunden = sy && sy.zustand().drive !== 'aus';

    return '<div class="lage-zeile">' +
      '<span' + (dauerhaft ? '' : ' class="warnung"') + '>' +
        esc(window.App.lageText()) + '</span>' +
      (verbunden
        ? '<button type="button" id="abgleich">Abgleich ' +
          (an ? 'abschalten' : 'einschalten') + '</button>'
        : '') +
      (objekt.geraete.length ? '<button type="button" id="leeren">Alles löschen</button>' : '') +
      '</div>';
  }

  /* ---------- Aufbau ---------- */

  function zeichnen() {
    var feld = document.getElementById('stichtag');
    if (feld && F.istGueltigesDatum(feld.value)) stichtagStand = feld.value;
    if (!stichtagStand) stichtagStand = F.heute();

    var liste = OB.alleFristen(objekt, stichtagStand, F);
    var z = OB.zusammenfassung(liste);
    var leer = !objekt.geraete.length;

    var html =
      '<div class="ort"><h1>' + esc(objekt.name || 'Mein Zuhause') + '</h1>' +
      '<button type="button" id="ortBearbeiten">Umbenennen</button></div>' +

      (leer ? '' : brennpunkt(liste) + bilanz(z)) +
      (meldung ? '<p class="fussnote">' + esc(meldung) + '</p>' : '') +

      (leer
        ? leererAnfang()
        : '<section style="margin-top:4px">' +
            '<div class="kopfzeile"><h2>Geräte</h2>' +
            '<a class="plus" href="geraeteakte.html?neu=1"><span>+</span>Gerät</a></div>' +
            geraeteListe(liste) +
          '</section>' + anstehend(liste)) +

      (leer ? ''
        : '<div class="stichtag"><label for="stichtag">Stichtag</label>' +
          '<input type="date" id="stichtag" value="' + esc(stichtagStand) + '"></div>') +

      lageZeile() +
      '<p class="fussnote">Fristen sind Orientierungswerte und ersetzen keine Rechtsberatung. ' +
      'Maßgeblich sind die Belege und die vertraglichen Vereinbarungen.</p>';

    var huelle = document.getElementById('huelle');
    huelle.innerHTML = html;
    verdrahten();
  }

  function verdrahten() {
    var st = document.getElementById('stichtag');
    if (st) st.addEventListener('change', zeichnen);

    var mehr = document.getElementById('mehr');
    if (mehr) mehr.addEventListener('toggle', function () { alleOffen = mehr.open; });

    /* Zwei Klicks, kein Browser-Dialog: der erste fragt, der zweite löscht. */
    var leeren = document.getElementById('leeren');
    if (leeren) leeren.addEventListener('click', function () {
      if (leeren.getAttribute('data-sicher') !== '1') {
        leeren.setAttribute('data-sicher', '1');
        leeren.textContent = 'Wirklich alles löschen?';
        return;
      }
      window.App.zuruecksetzen().then(function () { window.location.reload(); });
    });

    var ob = document.getElementById('ortBearbeiten');
    if (ob) ob.addEventListener('click', function () {
      var name = window.prompt('Wie heißt dieses Zuhause?', objekt.name || '');
      if (name === null) return;
      objekt.name = String(name).trim() || 'Mein Zuhause';
      window.App.speichern();
      zeichnen();
    });

    var abg = document.getElementById('abgleich');
    if (abg) abg.addEventListener('click', function () {
      var sy = window.App.zustand.sync;
      if (sy.istAktiv()) {
        meldung = sy.warnungAbschalten();
        sy.abschalten().then(zeichnen);
      } else {
        sy.einschalten().then(function (r) {
          meldung = r.fehler ? r.fehler
            : (r.entscheidungNoetig
              ? 'Beide Seiten haben sich geändert. Die Auswahl triffst du in der Geräteakte.'
              : 'Abgleich eingeschaltet. ' + (r.begruendung || ''));
          zeichnen();
        });
      }
      zeichnen();
    });
  }

  function starten() {
    window.App.starten().then(function (zu) {
      if (!zu.objekt) {
        document.getElementById('huelle').innerHTML =
          '<div class="fehlerkasten"><h2>Kein Datenstand</h2>' +
          '<p>Es konnte nichts geladen werden. Lade die Seite neu.</p></div>';
        return;
      }
      objekt = zu.objekt;
      if (!Array.isArray(objekt.geraete)) objekt.geraete = [];
      zeichnen();
    }).catch(function (e) {
      document.getElementById('huelle').innerHTML =
        '<div class="fehlerkasten"><h2>Start fehlgeschlagen</h2><p>' + esc(e.message) + '</p></div>';
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', starten);
  } else {
    starten();
  }
})();
</script>
</body>
</html>
