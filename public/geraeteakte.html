      geraetMeldung = { art: 'hinweis', text: 'Gerät gelöscht.' };
    } else if (f.art === 'aufgabe') {
      geraet.aufgaben = (geraet.aufgaben || []).filter(function (x) { return x.id !== f.id; });
      if (bearbeiteAufgabe === f.id) bearbeiteAufgabe = null;
    }
    sichern();
  }

  /**
   * Welche Ansprüche hängen an einer Störung? Eine Störung zu löschen
   * entfernt nicht automatisch die Verlängerung oder den Anspruch, der
   * daraus entstanden ist – das muss sichtbar sein, sonst bleibt eine
   * Frist ohne Begründung stehen.
   */
  function abhaengigeAnsprueche(stoerungId) {
    var treffer = [];
    (geraet.ansprueche || []).forEach(function (a) {
      (a.verlaengerungen || []).forEach(function (v) {
        if (v.stoerungId === stoerungId) {
          treffer.push('Verlängerung um ' + v.monate + ' Monate');
        }
      });
    });
    return treffer;
  }

  /* Texteingaben in ganzzahlige Einheiten wandeln, ohne den Umweg
     über Fließkomma: der Nachkommateil wird als Zeichenkette auf
     zwei Stellen gebracht und ganzzahlig angehängt. */
  function zuHundertstel(text) {
    var t = String(text == null ? '' : text).trim().replace(/\s/g, '').replace(',', '.');
    if (!/^\d+(\.\d{0,2})?$/.test(t)) return null;
    var teile = t.split('.');
    var ganz = parseInt(teile[0], 10);
    var nk = (teile[1] || '').padEnd(2, '0');
    return ganz * 100 + parseInt(nk, 10);
  }

  function lieferungAusFeldern(id) {
    var wert = function (f) { var e = document.getElementById(f); return e ? e.value : ''; };
    var voll = document.getElementById('lvoll');

    return {
      id: id,
      datum: wert('ldatum'),
      einheit: 'liter',
      mengeHundertstel: zuHundertstel(wert('lmenge')),
      gesamtCent: zuHundertstel(wert('lpreis')),
      volltankung: voll ? voll.checked : false,
      lieferant: wert('llieferant'),
      belegDokumentId: null
    };
  }

  /** Prüft eine Lieferung aus dem Formular. Leere Liste heißt: in Ordnung. */
  function lieferungPruefen(neu) {
    var fehler = BR.pruefeLieferung(neu, F.istGueltigesDatum)
      .filter(function (h) { return h.schwere === 'fehler'; });

    if (neu.mengeHundertstel === null) {
      fehler.push({ text: 'Die Menge ist keine gültige Zahl, zum Beispiel 2500 oder 2500,50.' });
    }
    if (neu.gesamtCent === null) {
      fehler.push({ text: 'Der Preis ist keine gültige Zahl, zum Beispiel 2250,00.' });
    }
    if (neu.datum && F.istGueltigesDatum(neu.datum) && neu.datum > stichtagStand) {
      fehler.push({ text: 'Das Lieferdatum liegt nach dem Stichtag.' });
    }

    return fehler;
  }

  function lieferungEintragen() {
    var neu = lieferungAusFeldern('lf_' + Date.now());
    var fehler = lieferungPruefen(neu);
    if (fehler.length) {
      lieferMeldung = { art: 'fehler', text: fehler.map(function (f) { return f.text; }).join(' ') };
      zeichnen(); return;
    }

    geraet.lieferungen = (geraet.lieferungen || []).concat([neu]);
    lieferMeldung = { art: 'erfolg',
      text: BR.mengeText(neu.mengeHundertstel, 'liter') + ' für ' + BR.eurText(neu.gesamtCent) +
            ' eingetragen (' + BR.preisText(neu) + ').' };
    sichern();
  }

  function lieferungAendern() {
    if (!bearbeiteLieferung) return;
    var geaendert = lieferungAusFeldern(bearbeiteLieferung);
    var fehler = lieferungPruefen(geaendert);
    if (fehler.length) {
      lieferMeldung = { art: 'fehler', text: fehler.map(function (f) { return f.text; }).join(' ') };
      zeichnen(); return;
    }

    geraet.lieferungen = (geraet.lieferungen || []).map(function (x) {
      if (x.id !== bearbeiteLieferung) return x;
      /* Felder übernehmen, aber Notiz und Belegverweis behalten –
         die stehen nicht im Formular und gingen sonst verloren. */
      geaendert.notiz = x.notiz;
      geaendert.belegDokumentId = x.belegDokumentId;
      return geaendert;
    });

    bearbeiteLieferung = null;
    lieferMeldung = { art: 'erfolg', text: 'Lieferung geändert.' };
    sichern();
  }

  function lieferungen() {
    var liste = BR.sortiert(geraet.lieferungen, F.istGueltigesDatum);
    var einheit = liste.length ? liste[0].einheit : 'liter';

    var zeilen = liste.slice().reverse().map(function (e) {
      var inArbeit = bearbeiteLieferung === e.id;
      return '<li' + (inArbeit ? ' class="inarbeit"' : '') + '>' +
        '<span><span class="titel">' + BR.mengeText(e.mengeHundertstel, e.einheit) + '</span> ' +
        (e.volltankung
          ? '<span class="modus plan" title="Bis zur gewohnten Höhe befüllt">voll</span>'
          : '<span class="modus" title="Teilbefüllung – verfälscht die Abschnittsrechnung">teilweise</span>') +
        '<br><span class="zusatz">' + deDatum(e.datum) +
        (e.lieferant ? ' · ' + esc(e.lieferant) : '') +
        (e.notiz ? '<br>' + esc(e.notiz) : '') + '</span>' +
        '<span class="zeilenknoepfe">' +
          (inArbeit
            ? '<span class="zusatz">wird bearbeitet</span>'
            : '<button type="button" class="knopf zart" data-lf-bearbeiten="' + esc(e.id) + '">bearbeiten</button> ' +
              loeschKnoepfe('lieferung', e.id)) +
        '</span></span>' +
        '<span class="wert">' + BR.eurText(e.gesamtCent) +
        '<br><span class="zusatz">' + BR.preisText(e) + '</span></span></li>';
    }).join('');

    /* Gesamtspanne */
    var sp = BR.verbrauchSpanne(geraet.lieferungen, F.istGueltigesDatum, F.tageZwischen);
    var spanneHtml = sp.belastbar
      ? '<div class="kennzahl">' +
          '<div class="gross">' + BR.mengeText(Math.round(sp.proJahrHundertstel), einheit) + '</div>' +
          '<div class="zusatz">hochgerechnet je Jahr · ' +
          BR.eurText(Math.round(sp.kostenProTagCent * 365)) + ' Brennstoffkosten</div>' +
          '<div class="zusatz">Grundlage: ' + BR.mengeText(sp.mengeHundertstel, einheit) +
          ' in ' + sp.tage + ' Tagen, ' + deDatum(sp.von) + ' bis ' + deDatum(sp.bis) + '</div>' +
        '</div>'
      : '<p class="leerhinweis">' + esc(sp.grund) + '</p>';

    /* Abschnitte */
    var ab = BR.verbrauchsAbschnitte(geraet.lieferungen, F.istGueltigesDatum, F.tageZwischen);
    var abHtml = ab.length
      ? '<ul class="liste">' + ab.slice().reverse().map(function (a) {
          return '<li><span><span class="titel">' + deDatum(a.von) + ' bis ' + deDatum(a.bis) + '</span><br>' +
            '<span class="zusatz">' + a.tage + ' Tage · ' + BR.mengeText(a.mengeHundertstel, einheit) + '</span>' +
            (a.belastbar ? '' : '<br><span class="warnung">' + esc(a.grund) + '</span>') + '</span>' +
            '<span class="wert ' + (a.belastbar ? '' : 'bald') + '">' +
            (a.proTagHundertstel / 100).toFixed(1).replace('.', ',') + ' l<br>' +
            '<span class="zusatz">je Tag</span></span></li>';
        }).join('') + '</ul>'
      : '';

    /* Jahre */
    var jahre = BR.jahresUebersicht(geraet.lieferungen, F.istGueltigesDatum);
    var jahrHtml = jahre.length
      ? '<ul class="liste">' + jahre.slice().reverse().map(function (j) {
          return '<li><span><span class="titel">' + esc(j.jahr) + '</span><br>' +
            '<span class="zusatz">' + j.anzahl + ' Lieferung' + (j.anzahl > 1 ? 'en' : '') + ' · ' +
            BR.preisText(j.schnittPreisProBezug, einheit) + ' im Schnitt</span></span>' +
            '<span class="wert">' + BR.mengeText(j.mengeHundertstel, einheit) + '<br>' +
            '<span class="zusatz">' + BR.eurText(j.gesamtCent) + '</span></span></li>';
        }).join('') + '</ul>'
      : '';

    var meldung = lieferMeldung
      ? '<p class="meldung ' + esc(lieferMeldung.art) + '">' + esc(lieferMeldung.text) + '</p>'
      : '';

    return spanneHtml +
      '<h3 class="ablaufkopf">Verbrauch je Abschnitt</h3>' + abHtml +
      '<h3 class="ablaufkopf">Nach Jahren</h3>' + jahrHtml +
      '<h3 class="ablaufkopf">Lieferungen</h3>' +
      '<ul class="liste">' + zeilen + '</ul>' +
      lieferFormular(meldung);
  }

  /* Ein Formular für beides. Im Bearbeitungsmodus ist es vorbelegt,
     immer offen und hat einen Abbruchknopf. */
  function lieferFormular(meldung) {
    var vorlage = bearbeiteLieferung
      ? (geraet.lieferungen || []).filter(function (x) { return x.id === bearbeiteLieferung; })[0]
      : null;

    var zahl = function (h) {
      if (!vorlage || !Number.isFinite(h)) return '';
      return (h / 100).toFixed(2).replace('.', ',');
    };

    return '<details class="katalog"' + (bearbeiteLieferung ? ' open' : '') + '>' +
      '<summary>' + (vorlage ? 'Lieferung bearbeiten' : 'Lieferung eintragen') + '</summary>' +
        '<div class="felder">' +
          '<label class="feld"><span>Datum</span><input type="date" id="ldatum" max="' +
            esc(stichtagStand) + '" value="' + esc(vorlage ? vorlage.datum : '') + '"></label>' +
          '<label class="feld"><span>Menge in Litern</span><input type="text" id="lmenge" inputmode="decimal" placeholder="2500" value="' +
            esc(vorlage ? zahl(vorlage.mengeHundertstel) : '') + '"></label>' +
          '<label class="feld"><span>Gesamtpreis in Euro</span><input type="text" id="lpreis" inputmode="decimal" placeholder="2250,00" value="' +
            esc(vorlage ? zahl(vorlage.gesamtCent) : '') + '"></label>' +
          '<label class="feld"><span>Lieferant</span><input type="text" id="llieferant" placeholder="Name" value="' +
            esc(vorlage ? (vorlage.lieferant || '') : '') + '"></label>' +
        '</div>' +
        '<label class="schalter"><input type="checkbox" id="lvoll"' +
          (!vorlage || vorlage.volltankung ? ' checked' : '') + '> ' +
        'bis zur gewohnten Höhe befüllt</label>' +
        '<p class="zusatz">Ohne diese Angabe lässt sich der Verbrauch zwischen zwei Lieferungen nicht belastbar berechnen.</p>' +
        meldung +
        (vorlage
          ? '<button type="button" class="knopf" data-lf-speichern="1">Änderung speichern</button> ' +
            '<button type="button" class="knopf zart" data-lf-abbrechen="1">Abbrechen</button>'
          : '<button type="button" class="knopf" data-lieferung="1">Eintragen</button>') +
      '</details>';
  }

  /* Schreibt und zeichnet neu. Der Schreibvorgang läuft weiter,
     auch wenn die Anzeige schon aktualisiert ist – scheitert er,
     erscheint die Meldung in der Kopfzeile. */
  function sichern() {
    zeichnen();
    return window.App.speichern().then(function (r) {
      if (!r.erfolg) zeichnen();
      return r;
    });
  }

  function ansichtWahl() {
    return '<div class="ansichtwahl">' +
      '<button type="button" class="reiter klein' + (ansicht === 'einfach' ? ' aktiv' : '') +
        '" data-ansicht="einfach">Einfach</button>' +
      '<button type="button" class="reiter klein' + (ansicht === 'alles' ? ' aktiv' : '') +
        '" data-ansicht="alles">Alles</button>' +
      '</div>';
  }

  /**
   * Einfache Ansicht: Gerät, wo gekauft, Rechnungen. Sonst nichts.
   * Fristen, Wartung und Störungen bleiben bewusst draußen – wer sie
   * braucht, schaltet um.
   */
  function einfacheAnsicht() {
    var i = geraet.identitaet || {};
    var nummern = nummernAusGeraet(geraet).filter(function (n) { return n && n.wert; });

    var zeile = function (label, wert) {
      var leer = !wert || !String(wert).trim();
      return '<div class="paar"><dt>' + esc(label) + '</dt>' +
        '<dd class="' + (leer ? 'leer' : '') + '">' + esc(leer ? 'nicht erfasst' : wert) + '</dd></div>';
    };

    /* Der wichtigste Anspruch für die einfache Ansicht: der, der das
       ganze Gerät abdeckt und am längsten läuft. Gibt es nur
       Bauteilansprüche, wird der längste davon gezeigt und als solcher
       benannt – sonst hält man ihn für eine Gerätegarantie. */
    var bester = (function () {
      var kandidaten = [];
      (geraet.ansprueche || []).forEach(function (a) {
        if (a.aktiv === false) return;
        try {
          kandidaten.push({ a: a, auskunft: F.anspruchsAuskunft(a, stichtagStand, 30) });
        } catch (e) { /* unvollständige Ansprüche bleiben draußen */ }
      });
      if (!kandidaten.length) return null;

      var ganzes = kandidaten.filter(function (k) { return k.a.bezug !== 'bauteil'; });
      var pool = ganzes.length ? ganzes : kandidaten;
      return pool.reduce(function (x, y) { return y.auskunft.ende > x.auskunft.ende ? y : x; });
    })();

    var schutz = bester
      ? '<section><h2>' + esc(ARTTEXT[bester.a.art] || 'Anspruch') + '</h2>' +
          '<div class="schutzblock ' + esc(bester.auskunft.status) + '">' +
            '<div class="gross">bis ' + deDatum(bester.auskunft.ende) + '</div>' +
            '<div class="zusatz">' + esc(restText(bester.auskunft.status, bester.auskunft.restTage)) +
            ' · ' + esc(bester.auskunft.ansprechpartner) +
            (bester.auskunft.ansprechpartnerName ? ': ' + esc(bester.auskunft.ansprechpartnerName) : '') +
            '</div>' +
            (bester.a.bezug === 'bauteil'
              ? '<div class="zusatz">Gilt nur für ' + esc(bester.a.bauteil || 'ein Bauteil') +
                ', nicht für das ganze Gerät.</div>'
              : '') +
          '</div></section>'
      : '';

    var belege = (geraet.dokumente || []).filter(function (d) {
      return d.typ === 'kaufbeleg' || d.typ === 'reparaturrechnung';
    });

    var belegListe = belege.length
      ? '<ul class="liste">' + belege.map(function (d) {
          return '<li><span><span class="marke ' + esc(d.typ) + '">' +
            esc(TYPTEXT[d.typ] || d.typ) + '</span><span class="titel">' + esc(d.titel) + '</span></span>' +
            '<span class="wert">' + deDatum(d.erstellt) + '</span></li>';
        }).join('') + '</ul>'
      : '<p class="leerhinweis">Noch keine Rechnung hinterlegt.</p>';

    belegListe += (belegMeldung
      ? '<p class="meldung ' + esc(belegMeldung.art) + '">' + esc(belegMeldung.text) + '</p>'
      : '') + belegFormularHtml();

    return '<div class="schild">' +
        '<h1>' + esc(geraet.name) + '</h1>' +
        '<p class="ort">' + esc(geraet.standort) + '</p>' +
        '<dl class="paare">' +
          zeile('Hersteller', i.hersteller) +
          zeile('Modell', i.modell) +
          (nummern.length ? zeile('Nummer', nummern[0].wert) : '') +
        '</dl></div>' +

      '<section><h2>Gekauft</h2>' +
        '<ul class="liste">' +
          '<li><span><span class="titel">' +
            esc(geraet.kauf.verkaeufer || 'Verkäufer nicht erfasst') + '</span><br>' +
            '<span class="zusatz">am ' + deDatum(geraet.kauf.datum) + '</span></span>' +
            '<span class="wert">' +
            (geraet.kauf.preisCent
              ? (geraet.kauf.preisCent / 100).toFixed(2).replace('.', ',') + ' €'
              : '') + '</span></li>' +
        '</ul>' +
      '</section>' +

      schutz +

      '<section><h2>Rechnungen</h2>' + belegListe + '</section>' +

      '<p class="umschalthinweis">Fristen, Wartung und Störungen sind ausgeblendet. ' +
      'Über <b>Alles</b> oben werden sie wieder sichtbar.</p>';
  }

  function lagezeile() {
    var sp = window.App.zustand.speicher;
    var sy = window.App.zustand.sync;
    var dauerhaft = sp ? sp.zustand().dauerhaft : false;
    var an = sy ? sy.istAktiv() : false;
    var verbunden = sy && sy.zustand().drive !== 'aus';

    return '<p class="lage' + (dauerhaft ? '' : ' fluechtig') + (an ? '' : ' abgeschaltet') + '">' +
      esc(window.App.lageText()) +
      (verbunden
        ? ' <button type="button" class="knopf zart" data-abgleich="' +
          (an ? 'aus' : 'an') + '">Abgleich ' + (an ? 'abschalten' : 'einschalten') + '</button>'
        : '') +
      ' <button type="button" class="knopf zart" data-zuruecksetzen="1">Demodaten zurücksetzen</button></p>' +
      (abgleichMeldung
        ? '<p class="meldung ' + esc(abgleichMeldung.art) + '">' + esc(abgleichMeldung.text) + '</p>'
        : '') +
      abgleichDialog();
  }

  function standText(b) {
    if (!b) return 'leer';
    return b.geraete + ' Geräte, ' + b.eintraege + ' Einträge' +
      (b.geaendert ? ', zuletzt geändert ' + deDatum(String(b.geaendert).slice(0, 10)) : '');
  }

  /* Beim Wiedereinschalten wird gefragt statt geraten. */
  function abgleichDialog() {
    if (!abgleichFrage) return '';
    return '<div class="abgleichfrage">' +
      '<h3>Welcher Stand soll gelten?</h3>' +
      '<p class="zusatz">Während der Abgleich aus war, haben sich beide Seiten verändert. ' +
      'Die nicht gewählte Seite wird überschrieben.</p>' +
      '<ul class="wahlliste">' +
        '<li><b>Dieses Gerät</b><br><span class="zusatz">' + esc(standText(abgleichFrage.lokal)) + '</span><br>' +
          '<button type="button" class="knopf" data-wahl="lokal">Diesen behalten</button></li>' +
        '<li><b>Drive</b><br><span class="zusatz">' + esc(standText(abgleichFrage.fern)) + '</span><br>' +
          '<button type="button" class="knopf" data-wahl="fern">Drive übernehmen</button></li>' +
        '<li><b>Beide zusammenführen</b><br><span class="zusatz">Je Gerät gewinnt der neuere Stand. ' +
          'Nichts geht verloren, was nur auf einer Seite existiert.</span><br>' +
          '<button type="button" class="knopf zart" data-wahl="zusammen">Zusammenführen</button></li>' +
      '</ul>' +
      (abgleichFrage.empfehlung
        ? '<p class="zusatz">Neuer ist: ' +
          (abgleichFrage.empfehlung === 'fern' ? 'Drive' : 'dieses Gerät') + '.</p>'
        : '') +
      '<button type="button" class="knopf zart" data-wahl-abbrechen="1">Abbrechen, aus lassen</button>' +
      '</div>';
  }

  function geraetKnoepfe() {
    var inhalt = geraetInhalt(geraet);
    var gefragt = loeschFrage && loeschFrage.art === 'geraet' && loeschFrage.id === geraet.id;
    return '<div class="geraetknoepfe">' +
      '<button type="button" class="knopf zart" data-ge-bearbeiten="' + esc(geraet.id) + '">Gerät bearbeiten</button> ' +
      '<button type="button" class="knopf zart" data-ge-neu="1">Neues Gerät</button> ' +
      (geraete.length > 1 ? loeschKnoepfe('geraet', geraet.id) : '') +
      (gefragt && inhalt.length
        ? '<div class="warnung">Mit dem Gerät verschwinden: ' + esc(inhalt.join(', ')) + '.</div>'
        : '') +
      (geraetMeldung
        ? '<p class="meldung ' + esc(geraetMeldung.art) + '">' + esc(geraetMeldung.text) + '</p>'
        : '') +
      '</div>';
  }

  function geraeteWahl() {
    return '<p class="zurueck"><a href="index.html">Zur Übersicht ' +
      esc(objekt.name) + '</a></p>' +
      '<div class="wahl">' + geraete.map(function (g, i) {
      return '<button type="button" class="reiter' + (i === aktivIdx ? ' aktiv' : '') +
             '" data-geraet="' + i + '">' + esc(g.name) + '</button>';
    }).join('') + '</div>';
  }

  function fussnote() {
    return '<p class="fussnote">Alle Fristen sind Orientierungswerte und ersetzen keine Rechtsberatung. ' +
      'Maßgeblich sind die Belege und die vertraglichen Vereinbarungen.</p>';
  }

  function zeichneHtml(html) {
    var huelle = document.getElementById('huelle');
    huelle.innerHTML = html;
    nachZeichnen(huelle);
  }

  function zeichnen() {
    hinweisZaehler = 0;
    geraet = geraete[aktivIdx];
    var sucheFeld = document.getElementById('suche');
    var stichtagFeld = document.getElementById('stichtag');
    var suche = sucheFeld ? sucheFeld.value : '';
    if (stichtagFeld && F.istGueltigesDatum(stichtagFeld.value)) {
      stichtagStand = stichtagFeld.value;
    }
    var stichtag = stichtagStand;

    var aktive = geraet.ansprueche.filter(function (a) { return a.aktiv !== false; });

    /* Zahlen für die Kopfzeilen der Blöcke. */
    var zaehlwerk = (function () {
      var abgelaufen = 0, laufend = 0;
      aktive.forEach(function (a) {
        try {
          var st = F.anspruchsAuskunft(a, stichtag, 30).status;
          if (st === 'abgelaufen') abgelaufen += 1; else laufend += 1;
        } catch (e) { /* fehlerhafte Ansprüche zählen nirgends mit */ }
      });

      var offen = 0, gesamt = 0;
      (geraet.aufgaben || []).forEach(function (auf) {
        var f = F.naechsteFaelligkeit(auf, stichtag);
        if (!f || f.fehler) return;
        gesamt += 1;
        if (f.status === 'abgelaufen' || f.status === 'bald' || f.status === 'laeuft_heute_ab') offen += 1;
      });

      var brennText = '';
      if (geraet.lieferungen && geraet.lieferungen.length) {
        var sp = BR.verbrauchSpanne(geraet.lieferungen, F.istGueltigesDatum, F.tageZwischen);
        brennText = sp.belastbar
          ? BR.mengeText(Math.round(sp.proJahrHundertstel), geraet.lieferungen[0].einheit) + ' im Jahr'
          : geraet.lieferungen.length + ' Lieferungen';
      }

      return {
        anspruchText: abgelaufen ? abgelaufen + ' abgelaufen, ' + laufend + ' laufend'
                                 : laufend + ' laufend',
        anspruchDringend: abgelaufen > 0,
        wartungText: offen ? offen + ' von ' + gesamt + ' fällig' : gesamt + ' Aufgaben',
        wartungDringend: offen > 0,
        brennstoffText: brennText,
        stoerungText: (geraet.stoerungen || []).length
          ? (geraet.stoerungen || []).length + ' erfasst' : 'keine erfasst',
        dokumentText: (geraet.dokumente || []).length + ' Dateien'
      };
    })();

    /* In der einfachen Ansicht endet die Seite nach den Rechnungen.
       Kein Ausblenden per CSS, sondern gar nicht erst aufbauen. */
    if (ansicht === 'einfach') {
      zeichneHtml(geraeteWahl() + ansichtWahl() + einfacheAnsicht() + fussnote());
      return;
    }

    var html =
      geraeteWahl() +
      ansichtWahl() +
      lagezeile() +
      (bearbeiteGeraet
        ? geraetFormular(bearbeiteGeraet === 'neu' ? leeresGeraet() : geraet)
        : schild() + geraetKnoepfe()) +
      '<div class="werkzeuge">' +
        '<input type="search" id="suche" placeholder="Seriennummer, Beleg, Bauteil …" value="' + esc(suche) + '">' +
        '<input type="date" id="stichtag" value="' + esc(stichtag) + '" aria-label="Stichtag">' +
      '</div>' +
      '<p class="stichtag-hinweis">Stichtag frei wählbar, um Fristen zu prüfen.</p>' +

      block('ansprueche', 'Gewährleistung und Garantie',
        zaehlwerk.anspruchText,
        (aktive.length > 1
          ? '<p class="unterzeile">Mehrere Ansprüche laufen parallel, mit verschiedenen Ansprechpartnern.</p>'
          : '') +
        aktive.map(function (a) { return anspruchZeile(a, stichtag); }).join('') +
        (bearbeiteAnspruch === 'neu' ? anspruchFormular(leererAnspruch()) : '') +
        (anspruchMeldung
          ? '<p class="meldung ' + esc(anspruchMeldung.art) + '">' + esc(anspruchMeldung.text) + '</p>'
          : '') +
        (bearbeiteAnspruch ? '' :
          '<button type="button" class="knopf zart" data-an-neu="1">Anspruch hinzufügen</button>'),
        zaehlwerk.anspruchDringend) +

      block('wartung', 'Wartung', zaehlwerk.wartungText,
        wartung(stichtag) + vorlagenListe(), zaehlwerk.wartungDringend) +

      (geraet.lieferungen
        ? block('brennstoff', 'Brennstoff', zaehlwerk.brennstoffText,
            '<p class="unterzeile">Aus den Lieferungen ergibt sich der Verbrauch – belastbar nur, wenn bis zur gewohnten Höhe befüllt wurde.</p>' +
            lieferungen(), false)
        : '') +

      block('stoerungen', 'Störungen und Reparaturen', zaehlwerk.stoerungText,
        '<p class="unterzeile">Zwei Angaben entscheiden, was rechtlich folgt: wer repariert hat und ob du bezahlt hast.</p>' +
        stoerungsAblauf() +
        '<h3 class="ablaufkopf">Verlauf</h3>' + historie(), false) +

      block('dokumente', 'Dokumente', zaehlwerk.dokumentText, dokumente(suche), false) +

      fussnote();

    zeichneHtml(html);

    /* Der Ablauf wird bei jedem Neuaufbau neu erzeugt – Eingaben
       kommen aus dem Zustandsobjekt zurück, damit nichts verloren geht. */
    /* nur noch Verdrahtung; der Aufbau steckt in zeichnen() */
  }

  function nachZeichnen(huelle) {
    /* Auf- und Zuklappen merken, ohne neu zu zeichnen. */
    var bloecke = huelle.querySelectorAll('details.block');
    for (var bi = 0; bi < bloecke.length; bi++) {
      (function (el) {
        el.addEventListener('toggle', function () {
          var k = el.getAttribute('data-block');
          if (k) offeneBloecke[k] = el.open;
        });
      })(bloecke[bi]);
    }

    /* Vorschau der berechneten Frist. Schreibt nur in ein einzelnes
       Element – ein Neuzeichnen würde den Fokus aus dem Feld reißen. */
    function vorschauAnspruch() {
      var ziel = document.getElementById('an_vorschau');
      if (!ziel) return;
      var vorlage = bearbeiteAnspruch === 'neu' ? leererAnspruch()
        : (geraet.ansprueche || []).filter(function (x) { return x.id === bearbeiteAnspruch; })[0];
      if (!vorlage) return;
      try {
        var a = anspruchAusFeldern(vorlage);
        var fehler = anspruchPruefen(a);
        ziel.textContent = fehler.length ? '—' : deDatum(F.berechneAnspruchEnde(a).ende);
      } catch (e) { ziel.textContent = '—'; }
    }

    function vorschauAufgabe() {
      var ziel = document.getElementById('au_vorschau');
      if (!ziel) return;
      var vorlage = bearbeiteAufgabe === 'neu' ? leereAufgabe() : findeAufgabe(bearbeiteAufgabe);
      if (!vorlage) return;
      var auf = aufgabeAusFeldern(vorlage);
      if (aufgabePruefen(auf).length) { ziel.textContent = '—'; return; }
      var f = F.naechsteFaelligkeit(auf, stichtagStand);
      ziel.textContent = (f && f.faellig) ? deDatum(f.faellig) : '—';
    }

    ['an_art','an_rolle','an_name','an_bezug','an_bauteil','an_beginnkey',
     'an_beginn','an_dauer','an_manuell','an_grundlage','an_aktiv'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) { el.addEventListener('input', vorschauAnspruch); el.addEventListener('change', vorschauAnspruch); }
    });
    ['au_titel','au_wert','au_einheit','au_basis','au_anker','au_vorlauf','au_aktiv'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) { el.addEventListener('input', vorschauAufgabe); el.addEventListener('change', vorschauAufgabe); }
    });

    var herstFeld = document.getElementById('ge_hersteller');
    if (herstFeld) {
      herstFeld.addEventListener('change', function () {
        var ziel = document.getElementById('ge_nummern');
        if (!ziel) return;
        /* Bereits getippte Werte retten, bevor das Schema wechselt. */
        var bisher = [];
        var alt = document.querySelectorAll('.ge_nummer');
        for (var i = 0; i < alt.length; i++) {
          if (alt[i].value) bisher.push({ art: alt[i].getAttribute('data-art'), wert: alt[i].value });
        }
        ziel.innerHTML = nummernFelder(this.value, bisher);
      });
    }
    var katFeld = document.getElementById('ge_kategorie');
    if (katFeld) {
      katFeld.addEventListener('change', function () {
        var ziel = document.getElementById('ge_stufe');
        if (!ziel) return;
        var u = SH.bewerteAnliegen(this.value, '');
        ziel.textContent = STUFENTEXT[u.stufe] || '';
        ziel.className = 'stufenzeile ' + u.stufe;
      });
    }

    var symFeld = document.getElementById('sym');
    if (symFeld) {
      symFeld.addEventListener('input', function () { ablauf.symptom = this.value; });
    }
    ['traeger', 'bezahlt', 'abnahme', 'firma'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener('change', function () { ablaufLesen(); });
    });

    /* Diese beiden gehören zum Objekt und wurden bisher nur im
       Arbeitsspeicher geändert – ohne sichern() war die Einstellung
       nach dem Neuladen wieder weg. */
    var nutz = document.getElementById('knutzung');
    if (nutz) nutz.addEventListener('change', function () {
      objektKontext.nutzung = this.value;
      objekt.gebaeude = objektKontext;
      vorlagenMeldung = null; sichern();
    });
    var einh = document.getElementById('keinheiten');
    if (einh) einh.addEventListener('change', function () {
      var n = parseInt(this.value, 10);
      objektKontext.einheiten = (n > 0 && n < 1000) ? n : 1;
      objekt.gebaeude = objektKontext;
      vorlagenMeldung = null; sichern();
    });

    var s = document.getElementById('suche');
    s.addEventListener('input', function () {
      var pos = this.selectionStart, wert = this.value;
      zeichnen();
      var neu = document.getElementById('suche');
      neu.focus();
      neu.value = wert;
      try { neu.setSelectionRange(pos, pos); } catch (e) {}
    });
    document.getElementById('stichtag').addEventListener('change', zeichnen);
  }

  /* Hinweisblasen: einmalig delegiert, damit Neuaufbauten nichts doppeln.
     Hover deckt nur Mauszeiger ab, Tippen und Tastatur brauchen dies hier. */
  function alleSchliessen(ausser) {
    var knoepfe = document.querySelectorAll('.hinweis > button[aria-expanded="true"]');
    for (var i = 0; i < knoepfe.length; i++) {
      if (knoepfe[i] !== ausser) knoepfe[i].setAttribute('aria-expanded', 'false');
    }
  }

  document.addEventListener('click', function (e) {
    if (!e.target.closest) return;

    var erledigt = e.target.closest('[data-erledigt]');
    if (erledigt) {
      alleSchliessen(null);
      erledigungEintragen(erledigt.getAttribute('data-erledigt'), stichtagStand);
      return;
    }

    var ausFeld = e.target.closest('[data-erledigt-feld]');
    if (ausFeld) {
      alleSchliessen(null);
      var id = ausFeld.getAttribute('data-erledigt-feld');
      var feld = document.getElementById('dat_' + id);
      erledigungEintragen(id, feld ? feld.value : '');
      return;
    }

    if (e.target.closest('[data-zuruecksetzen]')) {
      alleSchliessen(null);
      window.App.zuruecksetzen().then(function () { window.location.reload(); });
      return;
    }

    var reiter = e.target.closest('[data-geraet]');
    if (reiter) {
      alleSchliessen(null);
      aktivIdx = parseInt(reiter.getAttribute('data-geraet'), 10) || 0;
      vorlagenMeldung = null; lieferMeldung = null;
      ablauf.ergebnis = null; ablauf.meldung = null;
      meldungen = {};
      zeichnen(); return;
    }
    if (e.target.closest('[data-lieferung]')) { alleSchliessen(null); lieferungEintragen(); return; }

    var lfBearbeiten = e.target.closest('[data-lf-bearbeiten]');
    if (lfBearbeiten) {
      alleSchliessen(null);
      bearbeiteLieferung = lfBearbeiten.getAttribute('data-lf-bearbeiten');
      loeschFrage = null; lieferMeldung = null;
      zeichnen(); return;
    }
    if (e.target.closest('[data-lf-speichern]')) { alleSchliessen(null); lieferungAendern(); return; }
    if (e.target.closest('[data-lf-abbrechen]')) {
      alleSchliessen(null);
      bearbeiteLieferung = null;
      lieferMeldung = { art: 'hinweis', text: 'Bearbeitung abgebrochen, nichts geändert.' };
      zeichnen(); return;
    }

    if (e.target.closest('[data-beleg-neu]')) {
      alleSchliessen(null); belegFormular = true; belegMeldung = null; zeichnen(); return;
    }
    if (e.target.closest('[data-beleg-speichern]')) { alleSchliessen(null); belegAufnehmen(); return; }
    if (e.target.closest('[data-beleg-abbrechen]')) {
      alleSchliessen(null); belegFormular = false;
      belegMeldung = { art: 'hinweis', text: 'Abgebrochen, nichts aufgenommen.' };
      zeichnen(); return;
    }
    var blOeffnen = e.target.closest('[data-beleg-oeffnen]');
    if (blOeffnen) {
      alleSchliessen(null); belegOeffnen(blOeffnen.getAttribute('data-beleg-oeffnen')); return;
    }

    var abg = e.target.closest('[data-abgleich]');
    if (abg) {
      alleSchliessen(null);
      var sy = window.App.zustand.sync;
      if (abg.getAttribute('data-abgleich') === 'aus') {
        abgleichMeldung = { art: 'hinweis', text: sy.warnungAbschalten() };
        sy.abschalten().then(zeichnen);
      } else {
        abgleichMeldung = null;
        sy.einschalten().then(function (r) {
          if (r.fehler) { abgleichMeldung = { art: 'fehler', text: r.fehler }; }
          else if (r.entscheidungNoetig) { abgleichFrage = r; }
          else { abgleichMeldung = { art: 'erfolg',
            text: 'Abgleich eingeschaltet. ' + (r.begruendung || '') }; }
          zeichnen();
        });
      }
      zeichnen(); return;
    }

    var wahl = e.target.closest('[data-wahl]');
    if (wahl) {
      alleSchliessen(null);
      var w = wahl.getAttribute('data-wahl');
      abgleichFrage = null;
      window.App.zustand.sync.entscheidung(w).then(function (r) {
        if (r.daten) { objekt = r.daten; geraete = objekt.geraete || [];
          if (aktivIdx >= geraete.length) aktivIdx = 0;
          geraet = geraete[aktivIdx];
          objektKontext = objekt.gebaeude || objektKontext; }
        abgleichMeldung = { art: 'erfolg', text: 'Abgleich eingeschaltet, ' + r.quelle + '.' };
        zeichnen();
      });
      zeichnen(); return;
    }
    if (e.target.closest('[data-wahl-abbrechen]')) {
      alleSchliessen(null); abgleichFrage = null;
      abgleichMeldung = { art: 'hinweis', text: 'Abgleich bleibt abgeschaltet.' };
      zeichnen(); return;
    }

    var umschalt = e.target.closest('[data-ansicht]');
    if (umschalt) {
      alleSchliessen(null);
      ansicht = umschalt.getAttribute('data-ansicht');
      window.App.einstellungSetzen('ansicht', ansicht);
      zeichnen(); return;
    }

    var geBearb = e.target.closest('[data-ge-bearbeiten]');
    if (geBearb) {
      alleSchliessen(null);
      bearbeiteGeraet = geBearb.getAttribute('data-ge-bearbeiten');
      loeschFrage = null; geraetMeldung = null; zeichnen(); return;
    }
    if (e.target.closest('[data-ge-neu]')) {
      alleSchliessen(null); bearbeiteGeraet = 'neu'; geraetMeldung = null; zeichnen(); return;
    }
    if (e.target.closest('[data-ge-speichern]')) { alleSchliessen(null); geraetSpeichern(); return; }
    if (e.target.closest('[data-ge-abbrechen]')) {
      alleSchliessen(null); bearbeiteGeraet = null;
      geraetMeldung = { art: 'hinweis', text: 'Abgebrochen, nichts geändert.' };
      zeichnen(); return;
    }

    var anBearb = e.target.closest('[data-an-bearbeiten]');
    if (anBearb) {
      alleSchliessen(null);
      bearbeiteAnspruch = anBearb.getAttribute('data-an-bearbeiten');
      loeschFrage = null; anspruchMeldung = null; zeichnen(); return;
    }
    if (e.target.closest('[data-an-neu]')) {
      alleSchliessen(null); bearbeiteAnspruch = 'neu'; anspruchMeldung = null; zeichnen(); return;
    }
    if (e.target.closest('[data-an-speichern]')) { alleSchliessen(null); anspruchSpeichern(); return; }
    if (e.target.closest('[data-an-abbrechen]')) {
      alleSchliessen(null); bearbeiteAnspruch = null;
      anspruchMeldung = { art: 'hinweis', text: 'Abgebrochen, nichts geändert.' };
      zeichnen(); return;
    }

    var auBearb = e.target.closest('[data-au-bearbeiten]');
    if (auBearb) {
      alleSchliessen(null);
      bearbeiteAufgabe = auBearb.getAttribute('data-au-bearbeiten');
      loeschFrage = null; aufgabeMeldung = null; zeichnen(); return;
    }
    if (e.target.closest('[data-au-neu]')) {
      alleSchliessen(null); bearbeiteAufgabe = 'neu'; aufgabeMeldung = null; zeichnen(); return;
    }
    if (e.target.closest('[data-au-speichern]')) { alleSchliessen(null); aufgabeSpeichern(); return; }
    if (e.target.closest('[data-au-abbrechen]')) {
      alleSchliessen(null); bearbeiteAufgabe = null;
      aufgabeMeldung = { art: 'hinweis', text: 'Abgebrochen, nichts geändert.' };
      zeichnen(); return;
    }

    var frage = e.target.closest('[data-loeschen-frage]');
    if (frage) {
      alleSchliessen(null);
      loeschFrage = {
        art: frage.getAttribute('data-loeschen-frage'),
        id: frage.getAttribute('data-id'),
        aufgabeId: frage.getAttribute('data-aufgabe')
      };
      zeichnen(); return;
    }
    if (e.target.closest('[data-loeschen-ja]')) { alleSchliessen(null); loeschenAusfuehren(); return; }
    if (e.target.closest('[data-loeschen-nein]')) {
      alleSchliessen(null); loeschFrage = null; zeichnen(); return;
    }

    var vorl = e.target.closest('[data-vorlage]');
    if (vorl) { alleSchliessen(null); vorlageHinzufuegen(vorl.getAttribute('data-vorlage')); return; }

    if (e.target.closest('[data-pruefen]')) { alleSchliessen(null); ablaufLesen(); zeichnen(); return; }
    if (e.target.closest('[data-folge]'))   { alleSchliessen(null); folgeBerechnen(); return; }
    if (e.target.closest('[data-uebernehmen]')) { alleSchliessen(null); folgeUebernehmen(); return; }
    if (e.target.closest('[data-verwerfen]')) {
      alleSchliessen(null); ablauf.ergebnis = null;
      ablauf.meldung = { art: 'hinweis', text: 'Vorschau verworfen, nichts gespeichert.' };
      zeichnen(); return;
    }

    var zurueck = e.target.closest('[data-rueckgaengig]');
    if (zurueck) {
      alleSchliessen(null);
      erledigungEntfernen(zurueck.getAttribute('data-rueckgaengig'), zurueck.getAttribute('data-eintrag'));
      return;
    }

    var knopf = e.target.closest('.hinweis > button');
    if (!knopf) { alleSchliessen(null); return; }
    e.preventDefault();
    var offen = knopf.getAttribute('aria-expanded') === 'true';
    alleSchliessen(knopf);
    knopf.setAttribute('aria-expanded', offen ? 'false' : 'true');
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var offen = document.querySelector('.hinweis > button[aria-expanded="true"]');
    if (!offen) return;
    alleSchliessen(null);
    offen.focus();
  });

  function starten() {
    window.App.starten().then(function (z) {
      if (!z.objekt) {
        document.getElementById('huelle').innerHTML =
          '<div class="fehlerkasten"><h2>Keine Daten</h2><p>Es konnte kein Datenstand geladen werden.</p></div>';
        return;
      }
      objekt = z.objekt;
      geraete = objekt.geraete || [];
      objektKontext = objekt.gebaeude || objektKontext;
      aktivIdx = startIndex();
      geraet = geraete[aktivIdx];
      return window.App.einstellungLesen('ansicht', 'alles').then(function (a) {
        ansicht = (a === 'einfach') ? 'einfach' : 'alles';
        zeichnen();
      });
    }).catch(function (e) {
      document.getElementById('huelle').innerHTML =
        '<div class="fehlerkasten"><h2>Start fehlgeschlagen</h2><p>' + esc(e.message) + '</p></div>';
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', starten);
  } else {
    starten();
  }
})();
</script>
</body>
</html>
